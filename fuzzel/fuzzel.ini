[main]
font=Noto Sans Mono:size=14
terminal=foot -e

prompt="run: "
placeholder=application

icons-enabled=yes
icon-theme=Adwaita

show-actions=no
match-mode=fzf
sort-result=yes

anchor=center
layer=overlay
keyboard-focus=exclusive

width=42
lines=10
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=24

[colors]
background=1c1b18ff
text=ded5c4ff
prompt=c58e65ff
placeholder=817b71ff
input=f1e8d8ff
match=c58e65ff

selection=35312bff
selection-text=f1e8d8ff
selection-match=e0a476ff

counter=817b71ff
border=4a443bff

#alpha=0.8

[border]
width=1
radius=8
selection-radius=0
